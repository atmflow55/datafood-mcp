name: Deprecate old pulse-mcp + Publish DataFood
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz -o mcp.tar.gz
          tar xzf mcp.tar.gz
          chmod +x mcp-publisher
      - name: Login via GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Deprecate old pulse-mcp (all versions)
        run: ./mcp-publisher status --status deleted --all-versions --message "Renamed to io.github.atmflow55/datafood-mcp" io.github.atmflow55/pulse-mcp || echo "not-fatal"
      - name: Publish datafood-mcp
        run: ./mcp-publisher publish ./server.json
