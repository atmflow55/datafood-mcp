name: Publish to MCP Registry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server.json"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mp.tgz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.7.6/mcp-publisher_linux_amd64.tar.gz
          tar xzf mp.tgz
          chmod +x mcp-publisher
          ./mcp-publisher --help | head -3

      - name: Validate
        run: ./mcp-publisher validate ./server.json

      - name: Login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish
        run: ./mcp-publisher publish ./server.json
